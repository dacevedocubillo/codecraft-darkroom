<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111316"><meta name="description" content="Forgeline: practice your first IT support job in an interactive fictional workplace."><title>Forgeline · NovaTech Simulator</title>
<style>
:root{color-scheme:dark;--bg:#101214;--panel:#1a1d20;--border:#34383b;--muted:#a5a8a9;--gold:#e7b65b;--ink:#f5f1e9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}button{font:inherit;cursor:pointer}a{color:inherit}.wrap{max-width:1150px;margin:auto;padding:28px 22px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;border-bottom:1px solid var(--border)}.brand{font-size:21px;font-weight:800;letter-spacing:-.6px}.brand b,.eyebrow,.gold{color:var(--gold)}.sub{color:var(--muted)}.eyebrow{font:12px/1.5 monospace;letter-spacing:2px;text-transform:uppercase}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:22px}.office{grid-template-columns:220px 1fr}.panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:26px}.big{font-size:clamp(34px,5vw,60px);line-height:1.1;letter-spacing:-2px;margin:20px 0}.btn{border:0;border-radius:9px;background:var(--gold);color:#17120b;font-weight:750;padding:13px 18px}.btn:hover{filter:brightness(1.08)}.ghost{background:transparent;color:var(--ink);border:1px solid var(--border);padding:9px 12px;border-radius:8px}.ghost:hover,.nav:hover{border-color:var(--gold)}.card{padding:19px;border:1px solid var(--border);border-radius:12px;margin-bottom:12px}.tag{display:inline-block;border:1px solid #7b6235;background:#392f1d;color:#f2cd82;padding:4px 10px;border-radius:99px;font-size:12px}.nav{display:block;width:100%;text-align:left;background:transparent;color:var(--ink);padding:12px;border:1px solid transparent;border-radius:9px;margin:6px 0}.nav.active{background:#342b1d;color:var(--gold)}.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:15px}.tool{background:#24282b;color:var(--ink);border:1px solid var(--border);padding:15px 10px;border-radius:10px;text-align:left}.tool.done{border-color:var(--gold)}.evidence{font:12px/1.9 ui-monospace,monospace;background:#111417;padding:17px;border:1px solid var(--border);border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:12px}.option{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--border);border-radius:10px;padding:15px;margin:10px 0;cursor:pointer}.option:has(input:checked){border-color:var(--gold);background:#30291d}.feedback{padding:14px;background:#30291d;border:1px solid #84612e;border-radius:9px;margin-top:12px}.progress{height:7px;border-radius:8px;background:#34383b;overflow:hidden}.progress span{display:block;height:100%;background:var(--gold)}h2{font-size:28px;line-height:1.2}h3{margin:0 0 6px}.muted{color:var(--muted)}footer{border-top:1px solid var(--border);margin-top:45px;padding-top:20px;font-size:12px;color:var(--muted)}@media(max-width:760px){.grid,.office{grid-template-columns:1fr}.tools{grid-template-columns:1fr}.wrap{padding:20px 14px}.panel{padding:20px}.top{flex-wrap:wrap}}
</style></head><body>
<header class="wrap top"><div class="brand">forge<span class="gold">line</span><span class="sub"> / novatech</span></div><button class="ghost" id="reset">↻ Reset simulation</button></header>
<main class="wrap"><p class="eyebrow">Career simulator / IT support / Alpha 0.1</p><div id="app" aria-live="polite"></div><footer>Forgeline · Fictional workplace training. No real accounts or employee data are used. Progress is stored only in this browser.</footer></main>
<script>
(()=>{'use strict';const key='forgeline-gh-pages-v1';const app=document.getElementById('app');let state={stage:'welcome',tab:'tickets',inspected:[],selected:''};try{const saved=JSON.parse(localStorage.getItem(key)||'{}');if(['welcome','office','complete'].includes(saved.stage))state={...state,...saved,tab:'tickets',selected:''};if(!Array.isArray(state.inspected))state.inspected=[];state.inspected=state.inspected.filter(x=>['account','logs','kb'].includes(x));}catch{}
const evidence={account:['IDENTITY CONSOLE · MAYA CHEN','Email: maya.chen@novatech.example','Identity verification: complete (simulated)','Account status: LOCKED','Lock reason: 5 failed sign-in attempts','Password: VALID · no reset required'],logs:['AUTHENTICATION EVENTS','09:11–09:17 · 5 failed password attempts','09:17 · Account locked by security policy','09:23 · Correct password rejected: ACCOUNT_LOCKED','No suspicious sign-in locations detected'],kb:['KNOWLEDGE BASE · KB-104','1. Verify user identity through approved procedure','2. Review lock reason and authentication events','3. If no suspicious activity, unlock account','4. Confirm successful sign-in with the user','5. Document resolution in ticket']};const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(key,JSON.stringify({stage:state.stage,inspected:state.inspected}));const button=(id,label,cls='btn')=>'<button class="'+cls+'" data-action="'+id+'">'+label+'</button>';function render(){save();if(state.stage==='welcome'){app.innerHTML='<div class="grid"><section class="panel"><span class="tag">✉ New offer · Fictional simulation</span><p class="muted" style="margin-top:30px">FROM: Alex Rivera · IT Operations Lead</p><h1 class="big">Welcome to your <span class="gold">first day.</span></h1><p class="muted">You have joined NovaTech as a Junior IT Support Specialist. Investigate realistic technical issues in a safe, simulated workplace.</p><div class="card" style="margin:28px 0"><p class="eyebrow">Your role</p><strong>Junior IT Support Specialist</strong><p class="muted">Service Desk · Day 01 · Training environment</p></div>'+button('start','Accept offer & enter workspace →')+'<p class="muted" style="font-size:12px">This is a fictional training experience, not an employment offer.</p></section><aside><div class="panel"><p class="eyebrow">01 / onboarding</p><h3>Open your first ticket</h3><p class="muted">Read the request and understand the problem.</p></div><div class="panel" style="margin-top:12px"><p class="eyebrow">02 / investigate</p><h3>Use workplace tools</h3><p class="muted">Explore logs, account details and the knowledge base.</p></div><div class="panel" style="margin-top:12px"><p class="eyebrow">03 / resolve</p><h3>Make a decision</h3><p class="muted">Submit a resolution and get feedback.</p></div></aside></div>';return}if(state.stage==='complete'){app.innerHTML='<section class="panel" style="max-width:700px;margin:auto;text-align:center;padding:50px 25px"><div style="font-size:52px" class="gold">✓</div><p class="eyebrow">Ticket #001 · Resolved</p><h1 class="big">First ticket, done.</h1><p class="muted">You investigated the account lock, checked the evidence and chose the documented resolution. Great support starts with evidence.</p><div class="card">Skills practiced: Troubleshooting · Security awareness · Documentation</div>'+button('reset','Play again')+'</section>';return}const active=state.tab;app.innerHTML='<div class="grid office"><aside class="panel"><p class="eyebrow">NovaTech / Service Desk</p>'+[['tickets','▤ Tickets'],['inbox','✉ Inbox'],['team','◉ Team chat']].map(([id,label])=>'<button class="nav '+(active===id?'active':'')+'" data-action="tab-'+id+'">'+label+'</button>').join('')+'<div class="card" style="margin-top:30px"><p class="eyebrow">Day 01 progress</p><p>'+state.inspected.length+'/3 resources explored</p><div class="progress"><span style="width:'+(state.inspected.length/3*100)+'%"></span></div></div></aside><div>'+ (active==='tickets'?ticket():message(active))+'</div></div>'}
function message(tab){return '<section class="panel"><p class="eyebrow">'+(tab==='inbox'?'Inbox / 1 message':'Team chat / NovaTech')+'</p><h2>'+(tab==='inbox'?'Welcome to the team!':'Alex Rivera · IT Lead')+'</h2><p class="muted">'+(tab==='inbox'?'Hi! Your first support ticket is ready. Remember: investigate before making changes. — Alex':'Welcome aboard! The knowledge base has our procedure for account lockouts. Let me know once you resolve the ticket.')+'</p>'+button('tab-tickets','Go to ticket →')+'</section>'}
function ticket(){return '<section class="panel"><span class="tag">Ticket #001 · Medium priority · Open</span><h2>I can’t sign in to my account</h2><p class="muted">Maya Chen · Marketing · 09:25 AM</p><div class="card"><strong>Maya Chen</strong><p>“Hi! I tried signing in a few times this morning and now it says my account is locked. I think I remember my password. Can you help? I have a meeting in 20 minutes.”</p></div></section><section class="panel" style="margin-top:14px"><h3>⌕ Investigate</h3><p class="muted">Explore at least two resources before deciding.</p><div class="tools">'+[['account','Account console'],['logs','Sign-in logs'],['kb','Knowledge base']].map(([id,label])=>'<button class="tool '+(state.inspected.includes(id)?'done':'')+'" data-action="inspect-'+id+'">'+label+(state.inspected.includes(id)?' ✓':'')+'</button>').join('')+'</div>'+state.inspected.map(id=>'<div class="evidence">'+evidence[id].map(escape).join('\n')+'</div>').join('')+'</section><section class="panel" style="margin-top:14px"><h3>Resolve the ticket</h3><p class="muted">Choose the action best supported by your investigation.</p>'+[['reset-password','Reset Maya’s password immediately'],['unlock','Verify identity, unlock account, and confirm sign-in'],['escalate','Escalate without further action']].map(([id,label])=>'<label class="option"><input type="radio" name="resolution" value="'+id+'" '+(state.selected===id?'checked':'')+'>'+label+'</label>').join('')+'<div id="feedback" role="status"></div>'+button('submit','Submit resolution →')+'</section>'}
document.addEventListener('change',e=>{if(e.target.name==='resolution')state.selected=e.target.value});document.addEventListener('click',e=>{const target=e.target.closest('[data-action]');if(!target)return;const action=target.dataset.action;if(action==='reset'){localStorage.removeItem(key);state={stage:'welcome',tab:'tickets',inspected:[],selected:''};render()}else if(action==='start'){state.stage='office';render()}else if(action.startsWith('tab-')){state.tab=action.slice(4);render()}else if(action.startsWith('inspect-')){const id=action.slice(8);if(evidence[id]&&!state.inspected.includes(id))state.inspected.push(id);render()}else if(action==='submit'){const out=document.getElementById('feedback');let msg='';if(!state.selected)msg='Choose a resolution first.';else if(state.inspected.length<2)msg='Investigate at least two resources before deciding.';else if(state.selected==='unlock'){state.stage='complete';render();return}else if(state.selected==='reset-password')msg='Not quite: the logs show the password is valid. Review the account status.';else msg='Escalation is possible, but the documented procedure supports resolving this case safely.';out.innerHTML='<div class="feedback">'+escape(msg)+'</div>'}});render()})();
</script></body></html>
